<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aíla Soraya | Videomaker & Filmmaker</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #111111;
      color: #f2f0ec;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* MENU */

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 24px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      background: rgba(17, 17, 17, 0.88);
      backdrop-filter: blur(10px);
    }

    .logo {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    nav {
      display: flex;
      gap: 30px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    nav a {
      opacity: 0.7;
      transition: 0.3s;
    }

    nav a:hover {
      opacity: 1;
    }

    /* HERO */

    .hero {
      min-height: 100vh;
      padding: 150px 5% 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hero-title {
      margin-bottom: 50px;
    }

    .hero-title h1 {
      font-size: clamp(55px, 10vw, 150px);
      font-weight: 400;
      line-height: 0.9;
      letter-spacing: -5px;
    }

    .hero-title p {
      margin-top: 25px;
      font-size: 17px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #b7b2aa;
    }

    /* VIDEO PRINCIPAL */

    .main-video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #242424;
      overflow: hidden;
      position: relative;
    }

    .main-video video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* SEÇÕES */

    section {
      padding: 120px 5%;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 50px;
      border-bottom: 1px solid #333;
      padding-bottom: 18px;
    }

    .section-header h2 {
      font-size: 38px;
      font-weight: 400;
    }

    .section-number {
      color: #777;
      font-size: 13px;
    }

    /* PROJETOS */

    .projects {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 70px 30px;
    }

    .project {
      cursor: pointer;
    }

    .project-video {
      aspect-ratio: 16 / 9;
      background: #242424;
      overflow: hidden;
      margin-bottom: 18px;
    }

    .project-video video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .project:hover video {
      transform: scale(1.03);
    }

    .project-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .project h3 {
      font-size: 22px;
      font-weight: 400;
      margin-bottom: 5px;
    }

    .project p {
      font-size: 13px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* COMPETÊNCIAS */

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      max-width: 900px;
    }

    .skill {
      border: 1px solid #3a3a3a;
      padding: 12px 18px;
      font-size: 14px;
      color: #c4c0ba;
    }

    /* SOBRE */

    .about {
      max-width: 850px;
    }

    .about p {
      font-size: clamp(24px, 3vw, 40px);
      line-height: 1.25;
      font-weight: 300;
    }

    /* CONTATO */

    .contact {
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .contact h2 {
      font-size: clamp(50px, 8vw, 110px);
      font-weight: 400;
      line-height: 0.95;
      margin-bottom: 50px;
    }

    .contact-links {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
    }

    .contact-links a {
      border-bottom: 1px solid #555;
      padding-bottom: 5px;
      font-size: 15
